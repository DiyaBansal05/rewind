spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/recordingportal
    username: recordingportal
    password: recordingportal
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8080

app:
  # Frontend and backend are separate origins (different ports locally,
  # different domains -- Render vs Vercel -- in production), so links meant
  # to be clicked from anywhere (WhatsApp, email, a browser tab on the
  # frontend) must be absolute, not relative to whatever page happens to be
  # open when they're clicked.
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deployment-32bytes+}
    admin-expiration-minutes: 60
    student-expiration-days: 30
  qr:
    secret: ${QR_SECRET:dev-only-qr-secret-change-me-before-any-real-deployment}
  access:
    secret: ${ACCESS_SECRET:dev-only-access-secret-change-me-before-any-real-deployment}
    expiration-hours: 48
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    admin-recipient-number: ${WHATSAPP_ADMIN_NUMBER:}
  zoom:
    account-id: ${ZOOM_ACCOUNT_ID:}
    client-id: ${ZOOM_CLIENT_ID:}
    client-secret: ${ZOOM_CLIENT_SECRET:}
    oauth-base-url: ${ZOOM_OAUTH_BASE_URL:https://zoom.us}
    api-base-url: ${ZOOM_API_BASE_URL:https://api.zoom.us/v2}
    user-email: ${ZOOM_USER_EMAIL:realjava2015@gmail.com}
    # Safety rail while integrating against a real account with important
    # existing recordings: refuse to query Zoom for any date further back
    # than this many days, no matter what a caller asks for.
    max-lookback-days: ${ZOOM_MAX_LOOKBACK_DAYS:7}
  institute:
    timezone: ${INSTITUTE_TIMEZONE:Asia/Kolkata}
