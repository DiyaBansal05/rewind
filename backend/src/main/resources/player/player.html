<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}} · Recording</title>
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #059669; --warn: #b45309; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f8fafc; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .stage { background: #000; position: sticky; top: 0; z-index: 2; padding-top: env(safe-area-inset-top); }
  video { display: block; width: 100%; max-height: 70vh; aspect-ratio: 16 / 9; background: #000; margin: 0 auto; max-width: 1100px; }
  main { max-width: 760px; margin: 0 auto; padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.15rem; margin: 0; text-wrap: balance; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
  .pill { display: inline-block; margin-top: .75rem; font-size: .75rem; font-weight: 600; color: var(--warn); background: #fffbeb; border: 1px solid #fde68a; padding: .25rem .6rem; border-radius: 999px; }
  .notice { margin-top: 1rem; padding: .75rem 1rem; border-radius: 12px; font-size: .9rem; line-height: 1.4; display: none; align-items: center; gap: .75rem; justify-content: space-between; }
  .notice.show { display: flex; }
  .notice.info { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .notice.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .notice button { flex-shrink: 0; border: 0; background: rgba(0,0,0,.06); color: inherit; font: inherit; font-weight: 600; font-size: .85rem; padding: .5rem .8rem; border-radius: 8px; cursor: pointer; }
  .notice button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { margin-top: 1.25rem; font-size: .8rem; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<div class="stage">
  <video id="video" controls playsinline preload="metadata" controlslist="nodownload" oncontextmenu="return false"></video>
</div>
<main>
  <h1>{{TITLE}}</h1>
  <p class="meta">Class on {{CLASS_DATE}}</p>
  <span class="pill">Available until {{EXPIRES}}</span>

  <div id="resume" class="notice info" role="status">
    <span id="resume-text"></span>
    <button id="restart" type="button">Start over</button>
  </div>
  <div id="error" class="notice error" role="alert">
    <span id="error-text"></span>
    <button id="retry" type="button">Try again</button>
  </div>

  <p class="hint">Your place is saved as you watch, so you can close this page and pick up where you left off.</p>
</main>

<script>
(function () {
  var config = {{CONFIG}};
  var video = document.getElementById('video');
  var resumeBox = document.getElementById('resume');
  var errorBox = document.getElementById('error');
  var ended = false;

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    var mm = (h ? String(m).padStart(2, '0') : String(m)), ss = String(sec).padStart(2, '0');
    return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function showError(text, canRetry) {
    document.getElementById('error-text').textContent = text;
    document.getElementById('retry').style.display = canRetry ? '' : 'none';
    errorBox.classList.add('show');
  }

  function playedRanges() {
    var out = [];
    for (var i = 0; i < video.played.length; i++) out.push([video.played.start(i), video.played.end(i)]);
    return out;
  }

  function sendProgress() {
    if (ended || !isFinite(video.duration) || video.duration <= 0) return;
    var body = JSON.stringify({
      sessionId: config.sessionId,
      position: video.currentTime,
      duration: video.duration,
      played: playedRanges()
    });
    try {
      fetch(config.progressUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true })
        .then(function (res) {
          if (res.status === 410) {
            ended = true;
            video.pause();
            video.removeAttribute('src');
            video.load();
            showError('Access to this recording has ended. Ask your instructor if you still need it.', false);
          }
        })
        .catch(function () { /* offline for a moment; the next ping carries the same ranges */ });
    } catch (e) { /* ignore */ }
  }

  video.addEventListener('loadedmetadata', function () {
    var at = config.resumeAt || 0;
    if (at > 30 && at < video.duration - 30) {
      video.currentTime = at;
      document.getElementById('resume-text').textContent = 'Picking up where you left off, at ' + fmt(at) + '.';
      resumeBox.classList.add('show');
    }
  });
  document.getElementById('restart').addEventListener('click', function () {
    video.currentTime = 0;
    resumeBox.classList.remove('show');
    video.play().catch(function () {});
  });
  document.getElementById('retry').addEventListener('click', function () {
    errorBox.classList.remove('show');
    var at = video.currentTime;
    video.src = config.videoUrl;
    video.load();
    video.addEventListener('loadedmetadata', function once() {
      video.removeEventListener('loadedmetadata', once);
      if (at) video.currentTime = at;
    });
  });
  video.addEventListener('error', function () {
    if (ended) return;
    showError("The video didn't load. Check your connection and try again.", true);
  });

  var timer = null;
  video.addEventListener('play', function () {
    resumeBox.classList.remove('show');
    if (!timer) timer = setInterval(sendProgress, 15000);
  });
  video.addEventListener('pause', function () { clearInterval(timer); timer = null; sendProgress(); });
  video.addEventListener('ended', sendProgress);
  video.addEventListener('seeked', function () { if (video.paused) sendProgress(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') sendProgress(); });
  window.addEventListener('pagehide', sendProgress);

  video.src = config.videoUrl;
})();
</script>
</body>
</html>
