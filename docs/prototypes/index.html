<style>
  /* Layout idea: a strip of screen tabs, then phone frame + desktop frame side by side, with the build notes beside them.
     Palette mirrors the live app (Tailwind slate neutrals, emerald = approve, amber = pending, red = deny/revoke). */
  :root {
    --bg: #eef1f5;
    --ink: #0f172a;
    --muted: #64748b;
    --accent: #059669;
    --warn: #b45309;
    --danger: #dc2626;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  h1, h2, h3 { text-wrap: balance; }
  .tnum { font-variant-numeric: tabular-nums; }
  .phone { width: 375px; height: 780px; border: 10px solid #0f172a; border-radius: 44px; background: #f8fafc; position: relative; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(15,23,42,.35); flex-shrink: 0; }
  .phone-scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
  .phone-scroll::-webkit-scrollbar { display: none; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 24px; background: #0f172a; border-radius: 0 0 16px 16px; z-index: 50; }
  .desk { width: 900px; border-radius: 14px; background: #f8fafc; border: 1px solid #cbd5e1; overflow: hidden; box-shadow: 0 30px 60px -25px rgba(15,23,42,.3); flex-shrink: 0; }
  .chips { scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .sheet-in { animation: up .25s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6 } to { transform: none; opacity: 1 } }
</style>
</head>
<body class="min-h-full">
<div class="mx-auto max-w-[1400px] px-4 md:px-8 py-8">
  <header class="flex flex-col gap-2 max-w-3xl">
    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-700">Bangalore Computer Education · Recording Portal</p>

<script>

const REQUESTS = [
  { id: 1, name: 'Ananya Rao', phone: '98450 12233', batch: 'Python Morning A', date: '29 Oct', ago: '12 min ago', status: 'PENDING' },
  { id: 2, name: 'Karthik S', phone: '99001 44871', batch: 'Tally Evening', date: '28 Oct', ago: '40 min ago', status: 'PENDING' },

  { id: 5, name: 'Fatima Khan', phone: '81230 77654', batch: 'Excel Basics B', date: '27 Oct', ago: '5 h ago', status: 'PENDING' },

  { id: 7, name: 'Sneha Patil', phone: '98861 20034', batch: 'Python Morning A', date: '24 Oct', ago: '2 days ago', status: 'APPROVED', watch: 68, expires: '1 d 4 h' },
  { id: 8, name: 'Arjun Menon', phone: '99456 70012', batch: 'Web Dev Weekend', date: '19 Oct', ago: '5 days ago', status: 'APPROVED', watch: 0, expires: '5 h' },
  { id: 9, name: 'Divya R', phone: '90350 66221', batch: 'Tally Evening', date: '21 Oct', ago: '6 days ago', status: 'DENIED' },
]
const STATUS = {
  PENDING: 'bg-amber-100 text-amber-700', APPROVED: 'bg-emerald-100 text-emerald-700',
  DENIED: 'bg-red-100 text-red-700', REVOKED: 'bg-slate-200 text-slate-600', EXPIRED: 'bg-slate-200 text-slate-600',

const state = { period: 30, reqTab: 'PENDING', selectMode: false, selected: new Set(), batchFilter: null, search: '', extendBy: null, revokeOpen: false, revoked: false, studentSheet: false }

/* ---------- shared bits ---------- */
const icon = {
  req: '<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  bat: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  stu: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  play: '<polygon points="6 4 20 12 6 20 6 4"/>',
}
const svg = (p, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`

function adminHeader(title, sub) {
  return `<div class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 pt-7 px-4 pb-3">
    <div class="flex items-center justify-between">
      <div><p class="text-[11px] text-slate-400">Bangalore Computer Education</p><h2 class="text-lg font-bold text-slate-900">${title}</h2></div>
      <div class="w-9 h-9 rounded-full bg-slate-900 text-white grid place-items-center text-sm font-semibold">R</div>
    </div>${sub ? `<p class="text-xs text-slate-500 mt-0.5">${sub}</p>` : ''}</div>`
}
function bottomNav(active) {
  const items = [['req', 'Requests', 6], ['chart', 'Analytics', 0], ['bat', 'Batches', 2], ['stu', 'Students', 0]]
  return `<div class="absolute bottom-0 inset-x-0 bg-white border-t border-slate-200 grid grid-cols-4 pb-4 z-30">${items.map(([k, l, b]) => `
    <div class="flex flex-col items-center gap-1 pt-2.5 ${k === active ? 'text-slate-900' : 'text-slate-400'}">
      <div class="relative">${svg(icon[k])}${b ? `<span class="absolute -top-1 -right-2 bg-red-500 text-white text-[9px] rounded-full w-4 h-4 grid place-items-center">${b}</span>` : ''}</div>
      <span class="text-[11px] font-medium">${l}</span>${k === active ? '<span class="w-1 h-1 rounded-full bg-slate-900"></span>' : '<span class="w-1 h-1"></span>'}
    </div>`).join('')}</div>`
}
function phone(inner) { return `<div class="phone"><div class="notch"></div>${inner}</div>` }
function notes(title, items) {
  return `<aside class="max-w-sm rounded-xl bg-white border border-slate-200 p-5 self-start">
    <h3 class="text-sm font-semibold text-slate-900">${title}</h3>
    <ul class="mt-3 space-y-2.5 text-sm text-slate-600">${items.map(i => `<li class="flex gap-2"><span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-emerald-600 shrink-0"></span><span>${i}</span></li>`).join('')}</ul></aside>`
}

/* ---------- 1. analytics ---------- */
function analyticsData() {
  const p = state.period
  const seed = [2, 4, 3, 6, 1, 0, 5, 7, 4, 3, 8, 2, 1, 4]
  const f = p / 30
  return {
    total: Math.round(48 * f), change: p === 7 ? '+3' : p === 30 ? '+12%' : '+31%',
    approval: p === 7 ? 88 : p === 30 ? 92 : 90, turnaround: p === 7 ? '2h 05m' : p === 30 ? '3h 20m' : '4h 10m',
    watched: p === 7 ? 64 : p === 30 ? 71 : 69, bars: seed,
    batches: [['Python Morning A', Math.round(19 * f)], ['Tally Evening', Math.round(14 * f)], ['Web Dev Weekend', Math.round(9 * f)], ['Excel Basics B', Math.round(6 * f)]],
    top: [['Ananya Rao', 'Python Morning A', 6], ['Karthik S', 'Tally Evening', 5], ['Rohan Gowda', 'Web Dev Weekend', 4]],
  }
}
function barChart(vals, w, h) {
  const max = 8, bw = w / vals.length
  const labels = ['18', '', '', '', '', '', '', '25', '', '', '', '', '', '31']
  let out = `<svg viewBox="0 0 ${w} ${h + 18}" width="100%" role="img" aria-label="Requests per day, last 14 days, peak 8">`
  ;[0, 4, 8].forEach(g => { const y = h - (g / max) * h; out += `<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#e2e8f0"/><text x="${w}" y="${y - 3}" text-anchor="end" font-size="9" fill="#94a3b8">${g}</text>` })
  vals.forEach((v, i) => {
    const bh = (v / max) * h, last = i === vals.length - 1, peak = v === max
    out += `<rect x="${i * bw + 3}" y="${h - bh}" width="${bw - 6}" height="${bh}" rx="3" fill="${last ? '#059669' : peak ? '#0f172a' : '#cbd5e1'}"/>`
    if (labels[i]) out += `<text x="${i * bw + bw / 2}" y="${h + 13}" text-anchor="middle" font-size="9" fill="#94a3b8">${labels[i]} Oct</text>`
  })
  return out + '</svg>'
}
function kpi(label, value, sub, tone = 'text-slate-500') {
  return `<div class="bg-white rounded-xl border border-slate-200 p-3"><p class="text-[11px] text-slate-500">${label}</p><p class="text-xl font-bold text-slate-900 tnum mt-0.5">${value}</p><p class="text-[11px] ${tone} mt-0.5">${sub}</p></div>`
}
function analyticsBody(desktop) {
  const d = analyticsData(), maxB = Math.max(...d.batches.map(b => b[1]))
  const periods = [[7, '7 days'], [30, '30 days'], [90, '90 days']].map(([v, l]) =>
    `<button data-period="${v}" class="px-3 py-1.5 rounded-full text-xs font-medium ${state.period === v ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-600'}">${l}</button>`).join('')
  const kpis = `<div class="grid ${desktop ? 'grid-cols-4' : 'grid-cols-2'} gap-2.5">
      ${kpi('Requests', d.total, d.change + ' vs previous', 'text-emerald-700')}
      ${kpi('Approval rate', d.approval + '%', 'of decided requests')}
      ${kpi('Time to decide', d.turnaround, 'median, request → decision')}
      ${kpi('Actually watched', d.watched + '%', 'approved links opened & played', 'text-emerald-700')}
    </div>`
  const chart = `<section class="bg-white rounded-xl border border-slate-200 p-3.5">
      <div class="flex items-baseline justify-between"><h3 class="text-sm font-semibold">Requests per day</h3><span class="text-[11px] text-slate-400">last 14 days</span></div>
      <div class="mt-2">${barChart(d.bars, desktop ? 500 : 310, 110)}</div>
      <p class="text-[11px] text-slate-500 mt-1">Peak: <b class="text-slate-800">8 on 28 Oct</b> (Tally Evening, class cancelled mid-way)</p></section>`
  const batches = `<section class="bg-white rounded-xl border border-slate-200 p-3.5">
      <h3 class="text-sm font-semibold">By batch</h3>
      <ul class="mt-2.5 space-y-2.5">${d.batches.map(([n, v]) => `<li><div class="flex justify-between text-xs"><span class="text-slate-700">${n}</span><span class="tnum font-semibold">${v}</span></div>
        <div class="mt-1 h-2 rounded-full bg-slate-100"><div class="h-2 rounded-full bg-slate-800" style="width:${(v / maxB) * 100}%"></div></div></li>`).join('')}</ul></section>`
  const top = `<section class="bg-white rounded-xl border border-slate-200 p-3.5">
      <div class="flex items-baseline justify-between"><h3 class="text-sm font-semibold">Most frequent requesters</h3><span class="text-[11px] text-emerald-700 font-medium">See all</span></div>
      <ul class="mt-2 divide-y divide-slate-100">${d.top.map(([n, b, c], i) => `<li class="flex items-center gap-3 py-2">
        <span class="w-6 h-6 rounded-full bg-slate-100 text-[11px] font-semibold grid place-items-center">${i + 1}</span>
        <div class="min-w-0 flex-1"><p class="text-sm font-medium truncate">${n}</p><p class="text-[11px] text-slate-500">${b}</p></div>
        <span class="text-xs font-semibold tnum">${c} req</span></li>`).join('')}</ul></section>`
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], heat = [9, 6, 11, 4, 7, 3, 8]
  const missed = `<section class="bg-white rounded-xl border border-slate-200 p-3.5">
      <h3 class="text-sm font-semibold">Which class days get missed</h3>
      <div class="mt-2.5 grid grid-cols-7 gap-1.5">${days.map((dd, i) => `<div class="text-center"><div class="h-9 rounded-md grid place-items-center text-xs font-semibold tnum ${heat[i] > 8 ? 'bg-emerald-700 text-white' : heat[i] > 5 ? 'bg-emerald-300 text-emerald-950' : 'bg-emerald-100 text-emerald-800'}">${heat[i]}</div><p class="text-[10px] text-slate-500 mt-1">${dd}</p></div>`).join('')}</div></section>`
  return `<div class="flex gap-2 ${desktop ? '' : 'chips overflow-x-auto'}">${periods}</div>
    <div class="mt-3 space-y-3">${kpis}
      ${desktop ? `<div class="grid grid-cols-5 gap-3"><div class="col-span-3 space-y-3">${chart}${missed}</div><div class="col-span-2 space-y-3">${batches}${top}</div></div>` : chart + batches + top + missed}
    </div>`
}
function renderAnalytics() {
  return `<div class="flex flex-wrap gap-8 items-start">
    ${phone(`<div class="phone-scroll pb-24">${adminHeader('Analytics', 'How recordings are being requested and used')}<div class="p-4">${analyticsBody(false)}</div></div>${bottomNav('chart')}`)}
    <div class="hidden 2xl:block">${desktopFrame('Analytics', analyticsBody(true))}</div>
    ${notes('What gets built', [
      'New <b>Analytics</b> tab in the admin nav (bottom bar on phone, top tabs on desktop).',
      'Backend: one <code>GET /api/admin/analytics?days=30</code> endpoint returning totals, approval rate, median decision time, per-day counts, per-batch counts, top requesters and missed-weekday counts.',
      'Charts drawn as plain SVG (no chart library), so the bundle stays small and loads fast on mobile data.',
      '"Actually watched" comes from the new watch tracking in screen 3.',
    ])}
  </div>`
}
function desktopFrame(active, body) {
  const tabs = ['Requests', 'Analytics', 'Batches', 'Students']
  return `<div class="desk"><div class="h-7 bg-slate-200 flex items-center gap-1.5 px-3"><span class="w-2.5 h-2.5 rounded-full bg-red-400"></span><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span></div>
    <div class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between"><div><p class="font-bold">Bangalore Computer Education</p><p class="text-xs text-slate-400">Welcome, Rajesh</p></div><span class="text-sm text-slate-500">Sign out</span></div>
    <div class="px-6 pt-4"><div class="bg-slate-200/60 rounded-xl p-1 grid grid-cols-4 text-sm font-medium max-w-xl">${tabs.map(t => `<span class="rounded-lg py-2 text-center ${t === active ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500'}">${t}</span>`).join('')}</div></div>
    <div class="p-6">${body}</div></div>`
}

/* ---------- 2. requests ---------- */
function filteredRequests() {
  return REQUESTS.filter(r => (state.reqTab === 'ALL' || r.status === state.reqTab)
    && (!state.batchFilter || r.batch === state.batchFilter)
    && (!state.search || (r.name + r.phone + r.batch).toLowerCase().includes(state.search.toLowerCase())))
}
function requestCard(r) {
  const sel = state.selected.has(r.id), canSelect = state.selectMode && r.status === 'PENDING'
  const watchChip = r.status === 'APPROVED' ? (r.watch ? `<span class="text-[10px] font-medium bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full">Watched ${r.watch}%</span>` : `<span class="text-[10px] font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">Not opened yet</span>`) + `<span class="text-[10px] font-medium bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full">Expires in ${r.expires}</span>` : ''
  return `<li data-card="${r.id}" class="bg-white rounded-xl border ${sel ? 'border-emerald-500 ring-2 ring-emerald-100' : 'border-slate-200'} p-3.5 ${canSelect ? 'cursor-pointer' : ''}">
    <div class="flex items-start gap-3">
      ${canSelect ? `<span class="mt-0.5 w-5 h-5 rounded-md border-2 ${sel ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300'} grid place-items-center shrink-0">${sel ? svg('<path d="M5 12l5 5L20 7"/>', 14) : ''}</span>` : ''}
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2"><p class="font-semibold text-sm truncate">${r.name}</p><span class="text-[10px] font-medium px-2 py-0.5 rounded-full ${STATUS[r.status]}">${r.status}</span></div>
        <p class="text-xs text-slate-500 mt-0.5">${r.batch} · class on <b class="text-slate-700">${r.date}</b></p>
        <p class="text-[11px] text-slate-400 mt-0.5">${r.phone} · ${r.ago}</p>
        ${watchChip ? `<div class="flex flex-wrap gap-1.5 mt-2">${watchChip}</div>` : ''}

    ${r.status === 'PENDING' && !state.selectMode ? `<div class="mt-3 grid grid-cols-2 gap-2"><button class="bg-emerald-600 text-white text-sm font-medium rounded-lg py-2.5">Approve</button><button class="bg-slate-100 text-slate-700 text-sm font-medium rounded-lg py-2.5">Deny</button></div>` : ''}

  </li>`
}
function requestsControls(desktop) {
  const counts = { PENDING: 6, APPROVED: 2, ALL: 9 }
  const tabs = [['PENDING', 'Pending'], ['APPROVED', 'Approved'], ['ALL', 'All']].map(([k, l]) =>
    `<button data-reqtab="${k}" class="py-2 rounded-lg text-sm font-medium ${state.reqTab === k ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500'}">${l} <span class="text-[11px] text-slate-400">${counts[k]}</span></button>`).join('')
  const chips = [null, ...BATCHES].map(b => `<button data-batch="${b ?? ''}" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium ${state.batchFilter === b ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-600'}">${b ?? 'All batches'}</button>`).join('')
  return `<div class="bg-slate-200/70 rounded-xl p-1 grid grid-cols-3 ${desktop ? 'max-w-md' : ''}">${tabs}</div>
    <div class="mt-3 flex gap-2 ${desktop ? 'max-w-xl' : ''}"><label class="flex-1 flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 text-slate-400">${svg(icon.search, 16)}
      <input data-search id="search-${desktop ? 'd' : 'm'}" value="${state.search}" placeholder="Search name, phone or batch" class="w-full py-2.5 text-sm text-slate-900 outline-none bg-transparent"></label>
      <button class="px-3 rounded-xl bg-white border border-slate-200 text-xs font-medium text-slate-600">Date ▾</button></div>
    <div class="mt-2.5 flex gap-2 chips overflow-x-auto">${chips}</div>`
}
function renderRequests() {
  const list = filteredRequests()
  const n = state.selected.size
  const pendingVisible = list.filter(r => r.status === 'PENDING')
  const header = `<div class="flex items-center justify-between mt-4 mb-2"><p class="text-xs text-slate-500">${list.length} shown</p>
    ${state.reqTab !== 'APPROVED' ? `<div class="flex gap-3">${state.selectMode ? `<button data-selectall class="text-xs font-semibold text-slate-700">Select all ${pendingVisible.length}</button>` : ''}<button data-select class="text-xs font-semibold text-emerald-700">${state.selectMode ? 'Cancel' : 'Select'}</button></div>` : ''}</div>`
  const empty = `<div class="text-center py-10"><p class="text-sm font-medium text-slate-700">No requests match</p><p class="text-xs text-slate-400 mt-1">Try another batch or clear the search.</p></div>`
  const bulkBar = state.selectMode ? `<div class="absolute inset-x-3 bottom-[86px] z-40 sheet-in bg-slate-900 text-white rounded-2xl p-3 flex items-center gap-2 shadow-xl">
      <span class="text-sm font-medium flex-1 tnum">${n} selected</span>
      <button ${n ? '' : 'disabled'} class="px-3.5 py-2 rounded-lg bg-white/10 text-sm font-medium disabled:opacity-40">Deny</button>
      <button ${n ? '' : 'disabled'} class="px-3.5 py-2 rounded-lg bg-emerald-500 text-sm font-semibold disabled:opacity-40">Approve ${n || ''}</button></div>` : ''
  const deskBody = `${requestsControls(true)}${header}<ul class="grid grid-cols-2 gap-3">${list.map(requestCard).join('') || empty}</ul>
    ${state.selectMode ? `<div class="mt-4 bg-slate-900 text-white rounded-xl p-3 flex items-center gap-2 max-w-md"><span class="text-sm flex-1">${n} selected</span><button class="px-3 py-1.5 rounded-lg bg-white/10 text-sm">Deny</button><button class="px-3 py-1.5 rounded-lg bg-emerald-500 text-sm font-semibold">Approve ${n || ''}</button></div>` : ''}`
  return `<div class="flex flex-wrap gap-8 items-start">
    ${phone(`<div class="phone-scroll pb-44">${adminHeader('Requests', '6 waiting · oldest from yesterday')}<div class="p-4">${requestsControls(false)}${header}<ul class="space-y-2.5">${list.map(requestCard).join('') || empty}</ul></div></div>${bulkBar}${bottomNav('req')}`)}
    <div class="hidden 2xl:block">${desktopFrame('Requests', deskBody)}</div>
    ${notes('What gets built', [
      '<b>Pending / Approved / All</b> tabs replace the single pending-only list, so past decisions are findable.',
      'Search by student name, phone or batch, plus batch chips and a date-range filter. Backend: <code>GET /api/admin/recording-requests?status=&batchId=&q=&from=&to=</code>.',
      '<b>Select</b> mode for bulk approve/deny with a floating action bar above the thumb zone. Backend: <code>POST /bulk-approve</code> and <code>/bulk-deny</code>.',
      'Bulk approve reports per-row results: rows needing a manual recording pick (multiple Zoom matches) stay selected and show the existing picker.',
      'Larger tap targets (44 px buttons) and full-width actions on phone.',
    ])}
  </div>`
}

/* ---------- 3. access ---------- */
function renderAccess() {
  const ext = state.extendBy, revoked = state.revoked
  const expiry = revoked ? 'Revoked just now' : ext ? `Expires in ${ext === 1 ? '2 d 4 h' : ext === 3 ? '4 d 4 h' : '8 d 4 h'}` : 'Expires in 1 d 4 h'
  const pct = revoked ? 0 : ext ? 85 : 40
  const events = [
    ['Played to 1:16:10', 'Today, 9:42 PM', 'emerald'],
    ['Opened link (mobile, Chrome)', 'Today, 8:55 PM', 'slate'],
    ['Played to 0:31:05', 'Yesterday, 10:10 PM', 'emerald'],
    ['Opened link (mobile, Chrome)', 'Yesterday, 9:38 PM', 'slate'],
    ['Approved by you · link sent', '29 Oct, 6:20 PM', 'slate'],
  ]
  const body = `
    <div class="bg-white rounded-xl border border-slate-200 p-4">
      <div class="flex items-center justify-between"><div><p class="font-semibold">Sneha Patil</p><p class="text-xs text-slate-500">98861 20034</p></div>
        <span class="text-[10px] font-medium px-2 py-0.5 rounded-full ${revoked ? STATUS.REVOKED : STATUS.APPROVED}">${revoked ? 'REVOKED' : 'APPROVED'}</span></div>
      <p class="text-xs text-slate-500 mt-2">Python Morning A · class on <b class="text-slate-700">24 Oct</b></p>
      <div class="mt-3"><div class="flex justify-between text-xs"><span class="font-medium ${revoked ? 'text-slate-500' : 'text-amber-700'}">${expiry}</span>${revoked ? '' : '<span class="text-slate-400">72 h window</span>'}</div>
        <div class="mt-1.5 h-1.5 rounded-full bg-slate-100"><div class="h-1.5 rounded-full ${revoked ? 'bg-slate-300' : 'bg-amber-500'}" style="width:${pct}%"></div></div></div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-4 mt-3">
      <h3 class="text-sm font-semibold">Did they watch it?</h3>
      <div class="mt-3 flex items-center gap-4">
        <div class="relative w-20 h-20 shrink-0"><svg viewBox="0 0 36 36" class="w-20 h-20 -rotate-90"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#e2e8f0" stroke-width="4"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-dasharray="${0.68 * 97.4} 97.4"/></svg>
          <span class="absolute inset-0 grid place-items-center text-base font-bold tnum">68%</span></div>
        <dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-xs flex-1">
          <div><dt class="text-slate-500">Watched</dt><dd class="font-semibold tnum">1h 16m of 1h 52m</dd></div>
          <div><dt class="text-slate-500">Times opened</dt><dd class="font-semibold tnum">2</dd></div>
          <div><dt class="text-slate-500">First opened</dt><dd class="font-semibold">Yesterday</dd></div>
          <div><dt class="text-slate-500">Last activity</dt><dd class="font-semibold">Today 9:42 PM</dd></div>
        </dl></div>
      <ol class="mt-4 border-l-2 border-slate-100 ml-1.5 space-y-3">${events.map(([t, w, c]) => `<li class="pl-4 relative"><span class="absolute -left-[7px] top-1 w-3 h-3 rounded-full ${c === 'emerald' ? 'bg-emerald-500' : 'bg-slate-300'} ring-4 ring-white"></span><p class="text-xs font-medium text-slate-800">${t}</p><p class="text-[11px] text-slate-400">${w}</p></li>`).join('')}</ol>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 p-4 mt-3 ${revoked ? 'opacity-50 pointer-events-none' : ''}">
      <h3 class="text-sm font-semibold">Extend access</h3>
      <div class="mt-2.5 grid grid-cols-3 gap-2">${[1, 3, 7].map(dd => `<button data-extend="${dd}" class="py-2.5 rounded-lg text-sm font-medium ${ext === dd ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}">+${dd} day${dd > 1 ? 's' : ''}</button>`).join('')}</div>
      ${ext ? `<p class="mt-2 text-xs text-emerald-700">Extended. Same link keeps working; the student gets a WhatsApp/in-app note.</p>` : ''}
      <button data-revoke class="mt-3 w-full py-2.5 rounded-lg border border-red-200 text-red-600 text-sm font-medium">Revoke access now</button>
    </div>`
  const confirm = state.revokeOpen ? `<div class="absolute inset-0 z-50 bg-slate-900/40 flex items-end"><div class="sheet-in bg-white w-full rounded-t-3xl p-5 pb-8">
      <div class="w-10 h-1 rounded-full bg-slate-200 mx-auto mb-4"></div>
      <h3 class="font-semibold">Revoke Sneha's access?</h3><p class="text-sm text-slate-500 mt-1">The link stops working immediately, even mid-video. You can approve a new request later.</p>
      <div class="grid grid-cols-2 gap-2 mt-4"><button data-revoke-cancel class="py-3 rounded-xl bg-slate-100 text-sm font-medium">Keep access</button><button data-revoke-yes class="py-3 rounded-xl bg-red-600 text-white text-sm font-semibold">Revoke</button></div></div></div>` : ''
  return `<div class="flex flex-wrap gap-8 items-start">
    ${phone(`<div class="phone-scroll pb-24"><div class="sticky top-0 z-20 bg-white border-b border-slate-200 pt-7 px-4 pb-3 flex items-center gap-3"><button data-goto="requests" class="text-slate-500" aria-label="Back">${svg('<path d="M15 18l-6-6 6-6"/>')}</button><h2 class="text-lg font-bold">Recording access</h2></div><div class="p-4">${body}</div></div>${confirm}${bottomNav('req')}`)}
    ${notes('What gets built', [
      '<b>Extend</b> by 1, 3 or 7 days: pushes <code>accessExpiresAt</code> forward on the existing token, so the student\'s link doesn\'t change. <code>POST /api/admin/recording-requests/{id}/extend</code>.',
      '<b>Revoke</b> flips status to REVOKED; the <code>/r/{token}</code> endpoint already refuses non-approved requests, so playback stops on the next range request.',
      '<b>Watch tracking:</b> the link opens a small player page instead of the raw video. It sends a progress ping every 30 s (<code>POST /r/{token}/progress</code>), stored on a new <code>watch_progress</code> table (furthest position, total seconds watched).',
      'Opens are already logged in <code>AccessEvent</code>; that becomes the timeline above. New Flyway migration V4.',
      'The Approved tab on screen 2 shows "Watched 68%" / "Not opened yet" chips at a glance.',
    ])}
  </div>`
}

/* ---------- 4. student ---------- */
function renderStudent() {
  const sheet = state.studentSheet ? `<div class="absolute inset-0 z-50 bg-slate-900/40 flex items-end"><div class="sheet-in bg-white w-full rounded-t-3xl p-5 pb-8">
      <div class="w-10 h-1 rounded-full bg-slate-200 mx-auto mb-4"></div>
      <h3 class="font-semibold text-lg">Request a recording</h3>
      <p class="text-xs font-medium text-slate-600 mt-4">Batch</p>
      <div class="mt-1.5 grid grid-cols-1 gap-2"><button class="text-left px-4 py-3 rounded-xl border-2 border-slate-900 text-sm font-medium">Python Morning A <span class="block text-[11px] text-slate-500 font-normal">Mon, Wed, Fri · 7:00–9:00 AM</span></button>
        <button class="text-left px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium">Excel Basics B <span class="block text-[11px] text-slate-500 font-normal">Sat · 4:00–6:00 PM</span></button></div>
      <p class="text-xs font-medium text-slate-600 mt-4">Which class did you miss?</p>
      <div class="mt-1.5 flex gap-2 chips overflow-x-auto">${[['Fri', '31 Oct'], ['Wed', '29 Oct'], ['Mon', '27 Oct'], ['Fri', '24 Oct']].map(([d, dt], i) => `<button class="shrink-0 w-16 py-2 rounded-xl text-center ${i === 1 ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}"><span class="block text-[10px]">${d}</span><span class="block text-sm font-semibold">${dt.split(' ')[0]}</span><span class="block text-[10px]">${dt.split(' ')[1]}</span></button>`).join('')}<button class="shrink-0 px-3 rounded-xl border border-dashed border-slate-300 text-xs text-slate-500">Other date</button></div>
      <p class="text-[11px] text-slate-400 mt-1.5">Only days this batch has class are shown.</p>
      <button data-sheet-close class="mt-5 w-full py-3.5 rounded-xl bg-slate-900 text-white font-semibold">Send request</button></div></div>` : ''
  const body = `
    <div class="pt-8 px-4 pb-4 bg-white border-b border-slate-200">
      <div class="flex items-center justify-between"><div><p class="text-[11px] text-slate-400">Bangalore Computer Education</p><h2 class="text-xl font-bold">Hi, Sneha</h2></div>
        <button class="relative w-10 h-10 rounded-full bg-slate-100 grid place-items-center text-slate-600" aria-label="Notifications">${svg(icon.bell, 20)}<span class="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-red-500"></span></button></div>
      <button data-sheet-open class="mt-4 w-full py-3.5 rounded-xl bg-slate-900 text-white font-semibold flex items-center justify-center gap-2">${svg('<path d="M12 5v14M5 12h14"/>', 18)} Request a missed class</button>
    </div>
    <div class="p-4 space-y-3">
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Ready to watch</h3>
      <div class="rounded-2xl bg-gradient-to-br from-emerald-600 to-emerald-700 text-white p-4">
        <div class="flex justify-between items-start"><div><p class="font-semibold">Python Morning A</p><p class="text-xs text-emerald-100">Class on Fri, 24 Oct</p></div><span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">Expires in 1 d 4 h</span></div>
        <div class="mt-3 h-1.5 rounded-full bg-white/20"><div class="h-1.5 rounded-full bg-white" style="width:68%"></div></div>
        <p class="text-[11px] text-emerald-100 mt-1">You stopped at 1:16:10 of 1:52:00</p>
        <button class="mt-3 w-full py-3 rounded-xl bg-white text-emerald-800 font-semibold flex items-center justify-center gap-2">${svg(icon.play, 16)} Resume watching</button>
      </div>
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 pt-2">Your requests</h3>
      ${[['Python Morning A', 'Wed, 29 Oct', 'PENDING', 'Sent 12 min ago · usually approved within 3 h'], ['Excel Basics B', 'Sat, 18 Oct', 'EXPIRED', 'Access ended 22 Oct · request again if needed'], ['Python Morning A', 'Mon, 13 Oct', 'DENIED', 'Instructor note: recording failed that day']].map(([b, d, s, n]) => `
      <div class="bg-white rounded-xl border border-slate-200 p-3.5 flex gap-3"><span class="w-1 rounded-full ${s === 'PENDING' ? 'bg-amber-400' : s === 'DENIED' ? 'bg-red-400' : 'bg-slate-300'}"></span>
        <div class="flex-1 min-w-0"><div class="flex justify-between gap-2"><p class="text-sm font-semibold">${b}</p><span class="text-[10px] font-medium px-2 py-0.5 rounded-full ${STATUS[s]}">${s}</span></div>
        <p class="text-xs text-slate-500">${d}</p><p class="text-[11px] text-slate-400 mt-1">${n}</p></div></div>`).join('')}
    </div>`
  return `<div class="flex flex-wrap gap-8 items-start">
    ${phone(`<div class="phone-scroll pb-8">${body}</div>${sheet}`)}
    ${notes('What gets built', [
      'One big <b>Request a missed class</b> button opens a bottom sheet instead of the small inline form.',
      'Batch picked by tapping a card; the date picker only offers days that batch actually has class (from <code>classDaysOfWeek</code>), which removes most "no recording found" requests.',
      'Approved recordings sit on top with a <b>Resume watching</b> button, progress and an expiry countdown, so students no longer have to dig the link out of notifications.',
      'Notifications move behind the bell icon. Every status shows a one-line explanation.',
      'Admin side gets the same treatment: sticky headers, 44 px touch targets, bottom sheets for confirmations, and the batch QR / roster pages tidied for phone widths.',
    ])}
  </div>`
}

/* ---------- routing + events ---------- */
const RENDER = { analytics: renderAnalytics, requests: renderRequests, access: renderAccess, student: renderStudent }
function current() { const h = location.hash.slice(1); return RENDER[h] ? h : 'analytics' }
function render(keepFocus) {
  const cur = current()
  document.getElementById('tabs').innerHTML = SCREENS.map(s => `<a href="#${s.id}" class="px-4 py-2 rounded-full text-sm font-medium ${s.id === cur ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:border-slate-400'}">${s.label}</a>`).join('')
  const scrolls = [...document.querySelectorAll('.phone-scroll')].map(e => e.scrollTop)
  document.getElementById('stage').innerHTML = RENDER[cur]()
  document.querySelectorAll('.phone-scroll').forEach((e, i) => { e.scrollTop = scrolls[i] || 0 })
  if (keepFocus) { const el = document.getElementById(keepFocus); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length) } }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-period],[data-reqtab],[data-batch],[data-select],[data-selectall],[data-card],[data-extend],[data-revoke],[data-revoke-cancel],[data-revoke-yes],[data-goto],[data-sheet-open],[data-sheet-close]')
  if (!t) return
  const d = t.dataset
  if (d.period) state.period = +d.period
  else if (d.reqtab) { state.reqTab = d.reqtab; state.selected.clear(); if (d.reqtab === 'APPROVED') state.selectMode = false }
  else if ('batch' in d) state.batchFilter = d.batch || null
  else if ('select' in d) { state.selectMode = !state.selectMode; state.selected.clear() }
  else if ('selectall' in d) filteredRequests().filter(r => r.status === 'PENDING').forEach(r => state.selected.add(r.id))
  else if (d.card) { if (!state.selectMode) return; const id = +d.card; if (REQUESTS.find(r => r.id === id).status !== 'PENDING') return; state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id) }
  else if (d.extend) state.extendBy = +d.extend
  else if ('revoke' in d) state.revokeOpen = true
  else if ('revokeCancel' in d) state.revokeOpen = false
  else if ('revokeYes' in d) { state.revokeOpen = false; state.revoked = true }
  else if (d.goto) { location.hash = d.goto; return }
  else if ('sheetOpen' in d) state.studentSheet = true
  else if ('sheetClose' in d) state.studentSheet = false
  render()
})
document.addEventListener('input', e => { if (e.target.matches('[data-search]')) { state.search = e.target.value; render(e.target.id) } })
window.addEventListener('hashchange', () => render())
render()
</script>
</body>
</html>
